    - Pangolin:
        icon: sh-pangolin
        href: https://pangolin.example.com
        siteMonitor: http://localhost:3000
        widgets:
          - type: customapi
            url: https://raw.githubusercontent.com/jsaumer/homepage/main/demo/mock.json
            refreshInterval: 3600000
            mappings:
              - field: pangolin.0.sites
                label: sites
              - field: pangolin.0.resources
                label: Resources # capitalised: "resources" is one of Homepage's own label names
              - field: pangolin.0.traffic
                label: traffic
          - type: customapi
            url: https://raw.githubusercontent.com/jsaumer/homepage/main/demo/mock.json
            refreshInterval: 3600000
            mappings:
              - field: pangolin.1.sites
                label: sites
              - field: pangolin.1.resources
                label: Resources # capitalised: "resources" is one of Homepage's own label names
              - field: pangolin.1.traffic
                label: traffic
