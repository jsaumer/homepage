---
# Demonstration services for the Carte theme, ready to run as they are:
#   - the figures are made up, read by Homepage's customapi widget from demo/mock.json in this repo
#   - each status check points at Homepage itself (http://localhost:3000), so every service shows "up"
#   - under each mocked widget, the commented "real widget" block is the configuration to use with
#     the real service: delete the demo widget, uncomment that block, and point siteMonitor at the
#     service's own address
# Credentials in the real blocks are {{HOMEPAGE_VAR_...}} placeholders, which Homepage fills from
# environment variables of the same name (HOMEPAGE_VAR_SONARR_KEY=...).
#
# A few services matter to the theme by name (see "Make it yours" in the README):
#   - OPNsense and Jellyfin head the second and third columns on wide screens
#   - OPNsense, Mikrotik, Transmission and Pangolin get shortened labels so they fit on one line

- Platform:
    - Proxmox:
        icon: sh-proxmox
        href: https://proxmox.example.com
        siteMonitor: http://localhost:3000
        widget:
          type: customapi
          url: https://raw.githubusercontent.com/jsaumer/homepage/main/demo/mock.json
          refreshInterval: 3600000
          mappings:
            - field: proxmox.vms
              label: vms
            - field: proxmox.cpu
              label: cpu
            - field: proxmox.mem
              label: mem
        # real widget:
        # widget:
        #   type: proxmox
        #   url: https://proxmox.example.com
        #   username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
        #   password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
        #   fields: ["vms", "resources.cpu", "resources.mem"]
